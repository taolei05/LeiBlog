name: blog-server

services:
  blog-postgres:
    image: postgres:17-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leiblog
      POSTGRES_USER: leiblog
      POSTGRES_PASSWORD: 12345678
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leiblog -d leiblog"]
      interval: 5s
      timeout: 5s
      retries: 20

  blog-redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - blog-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  blog-postgres-data:
  blog-redis-data:
