name: Project Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install backend dependencies
        working-directory: blog-server
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install frontend dependencies
        working-directory: blog-client
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint, types, tests, build and audit
        run: ./check.sh
      - name: Isolated security integration tests
        working-directory: blog-server
        run: bun run test:security
      - name: Production deployment regression
        run: bash deploy/test-production.sh
